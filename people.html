<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B4F">
<title>ประวัติงานพนักงาน — โรงงานหยก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Trirong:wght@400;500;600&family=Sarabun:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="app.css?v=9">
<style>
  .wrap{max-width:1080px}
  .topbar-in{max-width:1080px}
  .range{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .range .field{margin:0;min-width:150px}

  .who-card{background:var(--surface);border:1px solid var(--jade);border-radius:8px;
            padding:14px 16px;margin-bottom:16px}
  .who-card .nm{font-family:var(--display);font-size:22px;font-weight:600}
  .who-card .facts{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin-top:8px}
  .who-card .facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  .kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;
       display:flex;flex-direction:column;gap:2px}
  .kpi .k{font-size:11.5px;letter-spacing:.08em;color:var(--ink-3)}
  .kpi .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:12px;font-weight:400;color:var(--ink-3);margin-inline-start:4px}
  .kpi .f{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  section{margin-bottom:26px}
  .sec-head{display:flex;gap:8px 16px;align-items:baseline;justify-content:space-between;
            flex-wrap:wrap;margin-bottom:10px}
  .sec-head h2{font-size:19px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}

  .tl{padding:11px 0;border-top:1px solid var(--line-2);display:flex;gap:12px;align-items:flex-start}
  .tl:first-child{border-top:0}
  .tl .when{flex:none;width:88px;font-size:12px;color:var(--ink-3);
            font-variant-numeric:tabular-nums;line-height:1.45}
  .tl .body{flex:1;min-width:0}
  .tl .t{font-size:14.5px}
  .tl .s{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}
  .tl .n{flex:none;font-variant-numeric:tabular-nums;font-size:14.5px;white-space:nowrap;text-align:end}
  .tl .n i{font-style:normal;color:var(--alert);display:block;font-size:12px}
  .daysep{font-size:12px;letter-spacing:.06em;color:var(--gold);
          padding:14px 0 5px;border-top:1px solid var(--line);margin-top:6px}
  .daysep:first-child{border-top:0;margin-top:0;padding-top:2px}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-3);font-size:14px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="eyebrow">ประวัติงานพนักงาน</span>
      <span class="nm" id="factory">โรงงานหยก</span>
    </div>
    <div class="who" id="who" hidden>
      <span><b id="who-name"></b></span>
      <button class="btn btn-sm btn-ghost" id="logout" type="button">ออก</button>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="nav">
    <a href="index.html">ลงงานผลิต</a>
    <a href="admin.html">หน้าหัวหน้า</a>
    <a href="review.html">ตรวจงาน</a>
    <a href="dashboard.html">แดชบอร์ด</a>
    <a href="people.html" class="on">พนักงาน</a>
    <a href="cost.html">ต้นทุน</a>
    <a href="manage.html">ตั้งค่า</a>
    <a href="log.html">Log</a>
  </nav>

  <section id="login" class="card">
    <h2>เข้าใช้งาน (หัวหน้า)</h2>
    <div class="msg err" id="login-msg" hidden></div>
    <div class="field">
      <label for="l-name">ชื่อ</label>
      <select id="l-name"><option value="">— กำลังโหลด —</option></select>
    </div>
    <div class="field">
      <label for="l-pin">PIN</label>
      <input id="l-pin" type="password" inputmode="numeric" placeholder="••••">
    </div>
    <button class="btn btn-primary btn-lg" id="l-go" type="button">เข้าใช้งาน</button>
  </section>

  <div id="app" hidden>
    <div class="range">
      <div class="field"><label for="r-emp">พนักงาน</label>
        <select id="r-emp"><option value="">— เลือกคน —</option></select></div>
      <div class="field"><label for="r-from">ตั้งแต่</label><input id="r-from" type="date"></div>
      <div class="field"><label for="r-to">ถึง</label><input id="r-to" type="date"></div>
      <button class="btn" id="r-go" type="button">ดูข้อมูล</button>
      <button class="btn btn-ghost" id="r-90" type="button">90 วันล่าสุด</button>
    </div>

    <div id="out"><p class="hint">เลือกพนักงานที่อยากดู แล้วกดดูข้อมูล</p></div>
  </div>
</main>

<script src="config.js?v=9"></script>
<script src="api.js?v=9"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var J = window.JADE;

  $("factory").textContent = J.factory;

  function loadBoot() {
    return J.rpc("app_bootstrap").then(function (d) {
      var sup = d.employees.filter(function (e) { return e.role === "supervisor"; });
      $("l-name").innerHTML = '<option value="">— เลือกชื่อ —</option>' +
        (sup.length ? sup : d.employees).map(function (e) {
          return '<option value="' + J.esc(e.name) + '">' + J.esc(e.name) + "</option>";
        }).join("");
      $("r-emp").innerHTML = '<option value="">— เลือกคน —</option>' +
        d.employees.map(function (e) {
          return '<option value="' + J.esc(e.name) + '">' + J.esc(e.name) +
            (e.role === "supervisor" ? " (หัวหน้า)" : "") + "</option>";
        }).join("");
      var saved = J.me.get();
      if (saved.name) $("l-name").value = saved.name;
    });
  }

  function enterApp() {
    $("login").hidden = true;
    $("app").hidden = false;
    $("who").hidden = false;
    $("who-name").textContent = J.me.get().name;
    setRange(30);
  }

  function setRange(days) {
    var d = new Date();
    $("r-to").value = J.today();
    $("r-from").value = new Date(d.getFullYear(), d.getMonth(), d.getDate() - days)
      .toISOString().slice(0, 10);
  }

  $("l-go").addEventListener("click", function () {
    var name = $("l-name").value, pin = $("l-pin").value;
    if (!name || !pin) { J.msg($("login-msg"), "เลือกชื่อและใส่ PIN", "err"); return; }
    $("l-go").disabled = true;
    J.rpc("sup_settings", { p_name: name, p_pin: pin }).then(function () {
      J.me.set(name, pin, "supervisor");
      enterApp();
    }).catch(function (err) { J.msg($("login-msg"), err.message, "err"); })
      .then(function () { $("l-go").disabled = false; });
  });
  $("l-pin").addEventListener("keydown", function (e) { if (e.key === "Enter") $("l-go").click(); });
  $("logout").addEventListener("click", function () { J.me.clear(); location.reload(); });

  $("r-go").addEventListener("click", load);
  $("r-emp").addEventListener("change", load);
  $("r-90").addEventListener("click", function () { setRange(90); load(); });

  function hoursTxt(min) {
    var m = Number(min) || 0;
    if (!m) return "—";
    var h = Math.floor(m / 60), mm = m % 60;
    return (h ? h + " ชม. " : "") + (mm ? mm + " น." : (h ? "" : "0 น."));
  }

  function load() {
    var emp = $("r-emp").value;
    if (!emp) { $("out").innerHTML = '<p class="hint">เลือกพนักงานที่อยากดูก่อน</p>'; return; }
    var m = J.me.get();
    $("out").innerHTML = '<p class="hint">กำลังโหลด…</p>';
    J.rpc("sup_person", {
      p_name: m.name, p_pin: m.pin, p_emp: emp,
      p_from: $("r-from").value || null, p_to: $("r-to").value || null, p_limit: 300
    }).then(render).catch(function (err) {
      $("out").innerHTML = '<p class="hint">' + J.esc(err.message) + "</p>";
    });
  }

  function render(d) {
    var w = d.who || {}, t = d.total || {};
    var days = Number(t.days) || 0, mins = Number(t.minutes) || 0;
    var html = "";

    html += '<div class="who-card">' +
      '<span class="nm">' + J.esc(w.name) + "</span> " +
      (w.code ? '<span class="chip idle">' + J.esc(w.code) + "</span> " : "") +
      (w.role === "supervisor" ? '<span class="chip ok">หัวหน้า</span> ' : "") +
      (w.active ? "" : '<span class="chip bad">พักงาน</span>') +
      '<div class="facts">' +
        "<span>มาทำงาน <b>" + J.nf.format(days) + "</b> วัน</span>" +
        "<span>ลงบันทึก <b>" + J.nf.format(t.entries || 0) + "</b> รายการ</span>" +
        "<span>แตะไป <b>" + J.nf.format(t.lots || 0) + "</b> ล็อต · <b>" +
          J.nf.format(t.steps || 0) + "</b> ขั้นตอน</span>" +
        "<span>แนบรูปหลักฐาน <b>" + J.nf.format(t.photos || 0) + "</b> รูป</span>" +
      "</div></div>";

    var tiles = [
      { k: "งานที่ทำ", v: J.nf.format(t.pieces || 0), u: "ชิ้น-ขั้นตอน",
        f: "ชิ้นเดียวผ่านหลายขั้น นับหลายครั้ง" },
      { k: "ดัน QC ผ่าน", v: J.nf.format(t.qc || 0), u: "ชิ้น",
        f: (t.qc ? "ยอดผลิตจริงที่คนนี้ทำได้" : "ยังไม่ได้ทำขั้นตอน QC") },
      { k: "ของเสียที่เจอ", v: J.nf.format(t.bad || 0), u: "ชิ้น",
        f: t.pieces ? "คิดเป็น " + ((t.bad || 0) / t.pieces * 100).toFixed(1) + "% ของงานที่ทำ" : "—",
        bad: (t.bad || 0) > 0 },
      { k: "ชั่วโมงที่ลงไว้", v: (mins / 60).toFixed(1), u: "ชม.",
        f: mins ? "จาก " + J.nf.format(t.timed || 0) + " ใน " + J.nf.format(t.entries || 0) + " รายการ"
                : "ยังไม่ได้ลงเวลาเลย" },
      { k: "สถานะการตรวจ", v: J.nf.format(t.approved || 0), u: "ยืนยันแล้ว",
        f: "รอตรวจ " + J.nf.format(t.pending || 0) + " · ตีกลับ " + J.nf.format(t.rejected || 0),
        warn: (t.pending || 0) > 0 }
    ];
    html += '<div class="kpis">' + tiles.map(function (x) {
      return '<div class="kpi' + (x.bad ? " bad" : x.warn ? " warn" : "") + '">' +
        '<span class="k">' + J.esc(x.k) + '</span><span class="v">' + x.v +
        "<small>" + J.esc(x.u) + '</small></span><span class="f">' + J.esc(x.f) + "</span></div>";
    }).join("") + "</div>";

    // ---- ทำขั้นตอนไหนบ้าง ----
    var st = d.by_step || [];
    html += '<section><div class="sec-head"><h2>ทำขั้นตอนไหนบ้าง</h2>' +
      '<span class="hint">เรียงตามลำดับในสายผลิต</span></div><div class="panel scroll">';
    if (!st.length) html += '<p class="empty">ยังไม่มีข้อมูลในช่วงนี้</p>';
    else {
      var maxP = Math.max.apply(null, st.map(function (x) { return Number(x.pieces) || 0; })) || 1;
      html += "<table><thead><tr><th>ขั้นตอน</th><th class='num'>ครั้ง</th><th class='num'>ชิ้น</th>" +
        "<th class='num'>เสีย</th><th class='num'>ชั่วโมง</th><th></th></tr></thead><tbody>" +
        st.map(function (x) {
          var p = Number(x.pieces) || 0;
          return "<tr><td>" + J.esc(x.step) + "</td><td class='num'>" + J.nf.format(x.n) +
            "</td><td class='num'>" + J.nf.format(p) + "</td><td class='num'>" +
            (Number(x.bad) ? '<span class="chip bad">' + J.nf.format(x.bad) + "</span>" : "—") +
            "</td><td class='num'>" + hoursTxt(x.minutes) + "</td>" +
            '<td style="width:30%"><span class="bar"><i style="width:' +
            (p / maxP * 100).toFixed(1) + '%"></i></span></td></tr>';
        }).join("") + "</tbody></table>";
    }
    html += "</div></section>";

    // ---- ไปช่วยล็อตไหนบ้าง ----
    var lt = d.by_lot || [];
    html += '<section><div class="sec-head"><h2>ไปช่วยล็อตไหนบ้าง</h2>' +
      '<span class="hint">เรียงตามปริมาณงาน</span></div><div class="panel scroll">';
    if (!lt.length) html += '<p class="empty">ยังไม่มีข้อมูลในช่วงนี้</p>';
    else {
      html += "<table><thead><tr><th>ล็อต</th><th>สินค้า</th><th>ขั้นตอนที่ทำ</th>" +
        "<th class='num'>ครั้ง</th><th class='num'>ชิ้น</th><th class='num'>ชั่วโมง</th></tr></thead><tbody>" +
        lt.map(function (x) {
          var steps = (x.steps || []);
          return "<tr><td>" + J.esc(x.lot) + "</td><td>" + J.esc(x.product_code) + " " +
            J.esc(x.product_name) + '</td><td><span class="lotlist">' +
            J.esc(steps.slice(0, 4).join(" · ")) + (steps.length > 4 ? " +" + (steps.length - 4) : "") +
            "</span></td><td class='num'>" + J.nf.format(x.n) + "</td><td class='num'>" +
            J.nf.format(x.pieces) + "</td><td class='num'>" + hoursTxt(x.minutes) + "</td></tr>";
        }).join("") + "</tbody></table>";
    }
    html += "</div></section>";

    // ---- งานอื่น / วันลา ----
    var ot = d.other || [];
    if (ot.length) {
      html += '<section><div class="sec-head"><h2>งานอื่น / วันลา</h2>' +
        '<span class="hint">บันทึกไว้แต่ไม่นับเข้ายอดผลิต</span></div><div class="panel scroll">' +
        "<table><thead><tr><th>วันที่</th><th>ทำอะไร</th><th class='num'>จำนวน</th></tr></thead><tbody>" +
        ot.map(function (x) {
          return "<tr><td>" + J.esc(J.thDate(x.d)) + "</td><td>" + J.esc(x.note) +
            "</td><td class='num'>" + (Number(x.qty) ? J.nf.format(x.qty) : "—") + "</td></tr>";
        }).join("") + "</tbody></table></div></section>";
    }

    // ---- ไทม์ไลน์ ----
    var en = d.entries || [];
    html += '<section><div class="sec-head"><h2>ทำอะไรไปบ้าง ทีละรายการ</h2>' +
      '<span class="hint">ใหม่สุดอยู่บน · สูงสุด 300 รายการ</span></div><div class="panel">';
    if (!en.length) html += '<p class="empty">ยังไม่มีรายการในช่วงนี้</p>';
    else {
      var day = "";
      html += en.map(function (x) {
        var sep = "";
        if (x.work_date !== day) { day = x.work_date; sep = '<div class="daysep">' + J.esc(J.thLong(day)) + "</div>"; }
        var chip = x.review_status === "approved" ? '<span class="chip ok">ยืนยันแล้ว</span>'
                 : x.review_status === "rejected" ? '<span class="chip bad">ตีกลับ</span>'
                 : '<span class="chip warn">รอตรวจ</span>';
        var sub = [];
        if (x.time_start && x.time_end) sub.push(x.time_start + "–" + x.time_end + " (" + hoursTxt(x.minutes) + ")");
        if (x.machine) sub.push("เครื่อง " + x.machine);
        if (x.photos) sub.push(x.photos + " รูป");
        if (x.note) sub.push(x.note);
        if (x.review_status === "rejected" && x.review_note) sub.push("ตีกลับ: " + x.review_note);
        return sep + '<div class="tl"><span class="when">' +
          (x.time_start || J.thDate(x.work_date, false)) + "</span>" +
          '<span class="body"><span class="t">' +
            J.esc(x.category === "other" ? (x.note || "งานอื่น") : (x.lot || "—") + " · " + (x.step || "—")) +
            " " + chip + "</span>" +
            (sub.length ? '<span class="s">' + J.esc(sub.join(" · ")) + "</span>" : "") +
          "</span>" +
          '<span class="n">' + J.nf.format(x.qty_good) +
            (x.qty_bad ? "<i>เสีย " + J.nf.format(x.qty_bad) + "</i>" : "") + "</span></div>";
      }).join("");
    }
    html += "</div></section>";

    $("out").innerHTML = html;
  }

  if (!J.configured()) {
    J.msg($("login-msg"), "ยังไม่ได้ตั้งค่า config.js", "err");
  } else {
    loadBoot().then(function () {
      var m = J.me.get();
      if (m.name && m.pin && m.role === "supervisor") enterApp();
    }).catch(function (err) { J.msg($("login-msg"), err.message, "err"); });
  }
})();
</script>
</body>
</html>
