<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B4F">
<title>งาน RD — โรงงานหยก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="app.css?v=34">
<style>
  .flow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .flow span{font-size:12.5px;padding:6px 11px;border-radius:999px;background:var(--surface-2);
             color:var(--ink-3)}
  .flow span.on{background:var(--jade);color:var(--on-jade);font-weight:500}
  .flow span.arrow{background:transparent;padding:6px 0;color:var(--ink-3)}
  .prj{border-top:1px solid var(--line-2);padding:11px 0}
  .prj:first-child{border-top:0}
  .prj .top{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
  .prj .nm{font-size:14.5px}
  .prj .cd{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .prj .s{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
  .prj .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .newbox{background:var(--surface-2);border-radius:8px;padding:13px;margin-top:12px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="eyebrow">งาน RD</span>
      <span class="nm" id="factory">โรงงานหยก</span>
    </div>
    <div class="who" id="who" hidden>
      <span><b id="who-name"></b></span>
      <button class="btn btn-sm btn-ghost" id="logout" type="button">ออก</button>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="nav" id="nav" hidden>
    <a href="index.html">ลงงานผลิต</a>
    <a href="rd.html" class="on">งาน RD</a>
    <a href="admin.html">หน้าหัวหน้า</a>
    <a href="review.html">ตรวจงาน</a>
    <a href="dashboard.html">แดชบอร์ด</a>
    <a href="people.html">พนักงาน</a>
    <a href="cost.html">ต้นทุน</a>
    <a href="kpi.html">KPI</a>
    <a href="manage.html">ตั้งค่า</a>
    <a href="log.html">Log</a>
  </nav>

  <section id="login" class="card">
    <h2>เข้าใช้งาน</h2>
    <div class="msg err" id="login-msg" hidden></div>
    <div class="field">
      <label for="l-name">ชื่อ</label>
      <select id="l-name"><option value="">— กำลังโหลด —</option></select>
    </div>
    <div class="field">
      <label for="l-pin">PIN</label>
      <input id="l-pin" type="password" inputmode="numeric" placeholder="••••">
    </div>
    <button class="btn btn-primary btn-lg" id="l-go" type="button">เข้าใช้งาน</button>
  </section>

  <div id="app" hidden>

    <!-- ---------- ลงงาน ---------- -->
    <div class="card">
      <h2>ลงงาน RD</h2>
      <div class="flow" id="flow"></div>

      <div class="field">
        <label for="f-prj">แบบ / โครงการ</label>
        <select id="f-prj"><option value="">— เลือกโครงการ —</option></select>
        <span class="hint" id="prj-hint">ยังไม่มีโครงการ? เปิดใหม่ได้ที่ข้างล่าง — ไม่ต้องรอเปิดล็อตผลิต</span>
      </div>

      <div class="field">
        <label for="f-step">ขั้นตอน</label>
        <select id="f-step"><option value="">— เลือกขั้นตอน —</option></select>
      </div>

      <div class="two">
        <div class="field">
          <label for="f-good">ทำได้ (แบบ/ชิ้น)</label>
          <input id="f-good" type="number" inputmode="numeric" min="0" placeholder="1">
        </div>
        <div class="field">
          <label for="f-bad">ต้องแก้ (รอบ)</label>
          <input id="f-bad" type="number" inputmode="numeric" min="0" placeholder="0">
        </div>
      </div>

      <div class="field">
        <label for="f-date">วันที่ทำ</label>
        <input id="f-date" type="date">
      </div>

      <div class="two">
        <div class="field">
          <label for="f-tstart">เวลาเริ่ม</label>
          <input id="f-tstart" type="time">
        </div>
        <div class="field">
          <label for="f-tend">เวลาเสร็จ</label>
          <input id="f-tend" type="time">
        </div>
      </div>
      <div class="durnote" id="dur" hidden></div>

      <div class="field">
        <label for="f-note">หมายเหตุ (ไม่บังคับ)</label>
        <textarea id="f-note" placeholder="เช่น ลูกค้าขอแก้ปีก / รอเจ้าของอนุมัติ"></textarea>
      </div>

      <div class="field">
        <label>รูปหลักฐาน (ไม่บังคับ · สูงสุด 3 รูป)</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
          <button class="btn btn-sm" data-pick="cam" type="button">ถ่ายรูป</button>
          <button class="btn btn-sm" data-pick="lib" type="button">เลือกจากอัลบั้ม</button>
        </div>
        <div class="shots" id="shot-preview"></div>
        <span class="hint" id="shot-hint">รูปแบบร่าง รูปต้นแบบ หรือรูปที่ลูกค้าส่งมาก็แนบได้</span>
      </div>

      <div class="msg" id="form-msg" hidden></div>
      <button class="btn btn-primary btn-lg" id="submit" type="button">บันทึกงาน</button>
    </div>

    <input id="shot-cam" type="file" accept="image/*" capture="environment" multiple hidden>
    <input id="shot-lib" type="file" accept="image/*" multiple hidden>

    <!-- ---------- โครงการ ---------- -->
    <section style="margin-top:22px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <h2 style="font-size:18px">แบบ / โครงการ</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="p-filter" style="padding:6px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink)">
            <option value="open">ที่ทำอยู่</option>
            <option value="all">ทั้งหมด</option>
            <option value="done">ที่สำเร็จ</option>
            <option value="cancelled">ที่ยกเลิก</option>
          </select>
          <button class="btn btn-sm" id="p-new" type="button">+ เปิดโครงการใหม่</button>
        </div>
      </div>

      <div class="card">
        <div class="newbox" id="newbox" hidden>
          <div class="field">
            <label for="n-title">ชื่อแบบ / โครงการ</label>
            <input id="n-title" type="text" placeholder="เช่น พระปิดตา รุ่นใหม่ / แก้แบบเตารีด v3">
          </div>
          <div class="two">
            <div class="field">
              <label for="n-prod">สินค้าที่เกี่ยวข้อง (ถ้ามี)</label>
              <select id="n-prod"><option value="">— ไม่ระบุ —</option></select>
            </div>
            <div class="field">
              <label for="n-due">กำหนดส่งให้ฝ่ายผลิต</label>
              <input id="n-due" type="date">
            </div>
          </div>
          <div class="field">
            <label for="n-note">หมายเหตุ</label>
            <input id="n-note" type="text" placeholder="เช่น ลูกค้าสั่งพิเศษ 200 องค์">
          </div>
          <div class="msg" id="new-msg" hidden></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" id="n-go" type="button">เปิดโครงการ</button>
            <button class="btn btn-ghost" id="n-cancel" type="button">ยกเลิก</button>
          </div>
        </div>
        <div class="msg" id="prj-msg" hidden></div>
        <div id="projects"></div>
      </div>
    </section>

    <!-- ---------- งานล่าสุด ---------- -->
    <section style="margin-top:22px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <h2 style="font-size:18px">งาน RD ล่าสุดของฉัน</h2>
        <a href="kpi.html" class="hint" id="kpi-link" hidden>ดู KPI ของแผนก →</a>
      </div>
      <div class="card"><div class="list" id="recent"></div></div>
    </section>
  </div>
</main>

<div class="queue" id="queue" hidden></div>

<script src="config.js?v=34"></script>
<script src="api.js?v=34"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var J = window.JADE;
  var boot = null, projects = [], shots = [], rdSteps = [];

  $("factory").textContent = J.factory;

  var ST = {
    open: '<span class="chip warn">ทำอยู่</span>',
    done: '<span class="chip ok">สำเร็จ</span>',
    cancelled: '<span class="chip idle">ยกเลิก</span>'
  };
  var CHIP = {
    pending: '<span class="chip warn">รอตรวจ</span>',
    approved: '<span class="chip ok">ผ่านแล้ว</span>',
    rejected: '<span class="chip bad">ไม่ผ่าน</span>'
  };

  /* ---------- เข้าใช้งาน ---------- */
  function loadBoot() {
    return J.rpc("app_bootstrap").then(function (d) {
      boot = d;
      rdSteps = (d.steps || []).filter(function (s) { return s.dept === "rd"; });
      $("l-name").innerHTML = '<option value="">— เลือกชื่อ —</option>' +
        (d.employees || []).map(function (e) {
          return '<option value="' + J.esc(e.name) + '">' + J.esc(e.name) + "</option>";
        }).join("");
      var saved = J.me.get();
      if (saved.name) $("l-name").value = saved.name;

      $("f-step").innerHTML = !rdSteps.length
        ? '<option value="">— ยังไม่มีขั้นตอนของ RD —</option>'
        : '<option value="">— เลือกขั้นตอน —</option>' + rdSteps.map(function (s) {
            return '<option value="' + J.esc(s.name) + '">' + J.esc(s.name) + "</option>";
          }).join("");
      $("flow").innerHTML = rdSteps.map(function (s, i) {
        return (i ? '<span class="arrow">→</span>' : "") + "<span>" + J.esc(s.name) + "</span>";
      }).join("") + (rdSteps.length ? '<span class="arrow">→</span><span>ส่งต่อฝ่ายผลิต</span>' : "");

      $("n-prod").innerHTML = '<option value="">— ไม่ระบุ —</option>' +
        (d.products || []).map(function (p) {
          return '<option value="' + J.esc(p.code) + '">' + J.esc(p.code) + " · " +
            J.esc(p.name) + "</option>";
        }).join("");
    });
  }

  function markFlow() {
    var cur = $("f-step").value;
    Array.prototype.forEach.call($("flow").querySelectorAll("span"), function (el) {
      if (el.className !== "arrow") el.className = el.textContent === cur ? "on" : "";
    });
  }

  function enterApp(role) {
    $("login").hidden = true;
    $("app").hidden = false;
    $("who").hidden = false;
    $("who-name").textContent = J.me.get().name;
    J.nav(role || J.me.get().role);
    // หน้า KPI เป็นของหัวหน้า พนักงานกดเข้าไปจะเจอแต่ error
    $("kpi-link").hidden = (role || J.me.get().role) !== "supervisor";
    J.enhanceDates(); J.enhanceTimes();
    $("f-date").value = J.today();
    loadProjects();
    loadRecent();
  }

  $("l-go").addEventListener("click", function () {
    var name = $("l-name").value, pin = $("l-pin").value;
    if (!name || !pin) { J.msg($("login-msg"), "เลือกชื่อและใส่ PIN", "err"); return; }
    $("l-go").disabled = true;
    J.rpc("app_rd_projects", { p_name: name, p_pin: pin, p_status: "open" }).then(function () {
      var role = "worker";
      (boot.employees || []).forEach(function (e) { if (e.name === name) role = e.role; });
      J.me.set(name, pin, role);
      enterApp(role);
    }).catch(function (err) { J.msg($("login-msg"), err.message, "err"); })
      .then(function () { $("l-go").disabled = false; });
  });
  $("l-pin").addEventListener("keydown", function (e) { if (e.key === "Enter") $("l-go").click(); });
  $("logout").addEventListener("click", function () { J.me.clear(); location.reload(); });

  /* ---------- โครงการ ---------- */
  function loadProjects() {
    var m = J.me.get();
    return J.rpc("app_rd_projects", { p_name: m.name, p_pin: m.pin, p_status: $("p-filter").value })
      .then(function (list) {
        projects = list || [];
        renderProjects();
        return J.rpc("app_rd_projects", { p_name: m.name, p_pin: m.pin, p_status: "open" });
      }).then(function (open) {
        var keep = $("f-prj").value;
        var arr = open || [];
        $("f-prj").innerHTML = !arr.length
          ? '<option value="">— ยังไม่มีโครงการที่เปิดอยู่ —</option>'
          : '<option value="">— เลือกโครงการ —</option>' + arr.map(function (p) {
              return '<option value="' + J.esc(p.code) + '">' + J.esc(p.code) + " · " +
                J.esc(p.name) + "</option>";
            }).join("");
        $("f-prj").value = keep;
      }).catch(function (err) {
        $("projects").innerHTML = '<p class="hint">' + J.esc(err.message) + "</p>";
      });
  }

  function renderProjects() {
    if (!projects.length) {
      $("projects").innerHTML = '<p class="hint" style="padding:14px 0">ยังไม่มีโครงการในกลุ่มนี้</p>';
      return;
    }
    $("projects").innerHTML = projects.map(function (p) {
      var late = p.status === "open" && p.days_left != null && p.days_left < 0;
      var soon = p.status === "open" && p.days_left != null && p.days_left >= 0 && p.days_left <= 3;
      return '<div class="prj"><div class="top"><span class="nm">' + J.esc(p.name) +
        (p.product_code ? ' <span class="cd">(' + J.esc(p.product_code) + ")</span>" : "") +
        "</span>" + (ST[p.status] || "") + "</div>" +
        '<div class="cd">' + J.esc(p.code) + "</div>" +
        '<div class="s">ลงงานแล้ว ' + J.nf.format(p.steps_done) + " ครั้ง" +
        (p.last_step ? " · ล่าสุด " + J.esc(p.last_step) : "") +
        (p.fixes ? ' · <span style="color:var(--alert)">แก้ ' + J.nf.format(p.fixes) + " รอบ</span>" : "") +
        (p.due_date ? " · กำหนดส่ง " + J.esc(J.thDate(p.due_date)) +
          (late ? ' <span class="chip bad">เลย ' + (-p.days_left) + " ว.</span>"
                : soon ? ' <span class="chip warn">อีก ' + p.days_left + " ว.</span>" : "") : "") +
        (p.closed_date ? " · ปิด " + J.esc(J.thDate(p.closed_date)) : "") +
        (p.note ? "<br>" + J.esc(p.note) : "") + "</div>" +
        (p.status === "open"
          ? '<div class="acts">' +
            '<button class="btn btn-sm" data-use="' + J.esc(p.code) + '" type="button">ลงงานโครงการนี้</button>' +
            '<button class="btn btn-sm btn-primary" data-done="' + J.esc(p.code) + '" type="button">ปิดว่าสำเร็จ</button>' +
            '<button class="btn btn-sm btn-danger" data-cancel="' + J.esc(p.code) + '" type="button">ยกเลิก</button>' +
            '<button class="btn btn-sm btn-ghost" data-del="' + J.esc(p.code) + '" type="button">ลบทิ้ง</button>' +
            "</div>"
          : '<div class="acts"><button class="btn btn-sm btn-ghost" data-reopen="' + J.esc(p.code) +
            '" type="button">เปิดใหม่</button>' +
            '<button class="btn btn-sm btn-ghost" data-del="' + J.esc(p.code) + '" type="button">ลบทิ้ง</button>' +
            "</div>") + "</div>";
    }).join("");

    bind("use", function (code) {
      $("f-prj").value = code;
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    bind("done", function (code) { setStatus(code, "done", "ปิดโครงการ " + code + " ว่าสำเร็จ?"); });
    bind("cancel", function (code) { setStatus(code, "cancelled", "ยกเลิกโครงการ " + code + "?"); });
    bind("reopen", function (code) { setStatus(code, "open", "เปิดโครงการ " + code + " ขึ้นมาใหม่?"); });
    bind("del", function (code) { delProject(code, false); });
  }

  // ลบโครงการทิ้งถาวร — ใช้ตอนเปิดผิด หรือเป็นของทดลอง
  // ถ้ามีงานลงไว้แล้ว เซิร์ฟเวอร์จะไม่ยอมลบรอบแรก ต้องยืนยันซ้ำ
  function delProject(code, force) {
    var p = null, i;
    for (i = 0; i < projects.length; i++) if (projects[i].code === code) p = projects[i];
    var nm = p ? p.name : code;
    if (!force && !confirm("ลบโครงการ " + code + " (" + nm + ") ทิ้งถาวร?\nงานที่ลงไว้ในโครงการนี้จะถูกลบไปด้วย และเอากลับมาไม่ได้")) return;
    var m = J.me.get();
    J.rpc("app_rd_delete", { p_name: m.name, p_pin: m.pin, p_code: code, p_force: !!force })
      .then(function (r) {
        loadProjects();
        loadRecent();
        J.msg($("prj-msg"), "ลบโครงการ " + code + " แล้ว" +
          (r && r.entries ? " (ลบงานที่ลงไว้ " + r.entries + " รายการไปด้วย)" : ""), "ok");
      })
      .catch(function (err) {
        // "มีการลงงานอยู่ N รายการ — ถ้าจะลบจริงต้องยืนยันอีกครั้ง"
        if (!force && err.message && err.message.indexOf("ยืนยันอีกครั้ง") >= 0) {
          if (confirm(err.message + "\n\nยืนยันลบ " + code + " ทิ้งจริง ๆ?")) delProject(code, true);
          return;
        }
        alert(err.message);
      });
  }

  function bind(attr, fn) {
    Array.prototype.forEach.call($("projects").querySelectorAll("[data-" + attr + "]"), function (b) {
      b.addEventListener("click", function () { fn(b.dataset[attr]); });
    });
  }

  function setStatus(code, status, ask) {
    if (!confirm(ask)) return;
    var m = J.me.get();
    J.rpc("app_rd_close", { p_name: m.name, p_pin: m.pin, p_code: code, p_status: status })
      .then(loadProjects)
      .catch(function (err) { alert(err.message); });
  }

  $("p-filter").addEventListener("change", loadProjects);
  $("p-new").addEventListener("click", function () {
    $("newbox").hidden = !$("newbox").hidden;
    if (!$("newbox").hidden) $("n-title").focus();
  });
  $("n-cancel").addEventListener("click", function () { $("newbox").hidden = true; });

  $("n-go").addEventListener("click", function () {
    var m = J.me.get();
    var title = $("n-title").value.trim();
    if (!title) { J.msg($("new-msg"), "ตั้งชื่อแบบ/โครงการก่อน", "err"); return; }
    $("n-go").disabled = true;
    J.rpc("app_rd_open", {
      p_name: m.name, p_pin: m.pin, p_title: title,
      p_product: $("n-prod").value || null,
      p_due: $("n-due").value || null,
      p_note: $("n-note").value || null
    }).then(function (r) {
      J.msg($("new-msg"), "เปิดโครงการ " + r.code + " แล้ว", "ok");
      $("n-title").value = ""; $("n-note").value = ""; $("n-due").value = "";
      $("n-prod").value = "";
      return loadProjects().then(function () { $("f-prj").value = r.code; });
    }).catch(function (err) { J.msg($("new-msg"), err.message, "err"); })
      .then(function () { $("n-go").disabled = false; });
  });

  /* ---------- เวลา ---------- */
  function updateDuration() {
    var t = J.durationText($("f-tstart").value, $("f-tend").value);
    var box = $("dur");
    if (!t) { box.hidden = true; return; }
    box.hidden = false;
    box.textContent = t;
    box.className = "durnote" + (t.indexOf("ต้องหลัง") >= 0 ? " bad" : "");
  }
  $("f-tstart").addEventListener("timechange", updateDuration);
  $("f-tend").addEventListener("timechange", updateDuration);
  $("f-step").addEventListener("change", markFlow);

  /* ---------- รูป ---------- */
  function renderShots() {
    $("shot-preview").innerHTML = shots.map(function (s, i) {
      return '<span class="shot"><img src="' + s + '" alt=""><button type="button" data-rm="' +
        i + '">×</button></span>';
    }).join("");
    Array.prototype.forEach.call($("shot-preview").querySelectorAll("[data-rm]"), function (b) {
      b.addEventListener("click", function () { shots.splice(Number(b.dataset.rm), 1); renderShots(); });
    });
    $("shot-hint").textContent = shots.length
      ? "แนบไว้ " + shots.length + " รูป (กดรูปเพื่อลบ)"
      : "รูปแบบร่าง รูปต้นแบบ หรือรูปที่ลูกค้าส่งมาก็แนบได้";
  }

  function onPickShots(e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = "";
    if (!files.length) return;
    var room = 3 - shots.length;
    if (room <= 0) { $("shot-hint").textContent = "ครบ 3 รูปแล้ว ลบรูปเดิมก่อนถ้าจะเปลี่ยน"; return; }
    files = files.slice(0, room);
    $("shot-hint").textContent = "กำลังย่อรูป…";
    var left = files.length;
    files.forEach(function (f) {
      J.shrinkImage(f, 1000, 0.62, function (data) {
        if (data) shots.push(data);
        if (--left === 0) renderShots();
      });
    });
  }
  $("shot-cam").addEventListener("change", onPickShots);
  $("shot-lib").addEventListener("change", onPickShots);
  Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"), function (b) {
    b.addEventListener("click", function () {
      $(b.dataset.pick === "cam" ? "shot-cam" : "shot-lib").click();
    });
  });

  function uploadShots(entryId) {
    var m = J.me.get();
    var list = shots.slice();
    shots = []; renderShots();
    if (!list.length) return;
    var done = 0;
    list.reduce(function (chain, data) {
      return chain.then(function () {
        return J.rpc("app_add_photo", { p_name: m.name, p_pin: m.pin, p_entry: entryId, p_data: data })
          .then(function () {
            done++;
            J.msg($("form-msg"), "กำลังส่งรูป " + done + "/" + list.length + "…", "ok");
          });
      });
    }, Promise.resolve()).then(function () {
      J.msg($("form-msg"), "บันทึกและแนบรูป " + done + " รูปเรียบร้อย", "ok");
      loadRecent();
    }).catch(function (err) {
      J.msg($("form-msg"), "บันทึกงานแล้ว แต่แนบรูปไม่สำเร็จ: " + err.message, "warn");
    });
  }

  /* ---------- ส่งบันทึก ---------- */
  var skipTime = false;
  $("submit").addEventListener("click", function () {
    var m = J.me.get();
    var prj = $("f-prj").value, step = $("f-step").value;
    var good = Number($("f-good").value || 0), bad = Number($("f-bad").value || 0);
    if (!prj) { J.msg($("form-msg"), "เลือกโครงการก่อน (หรือเปิดโครงการใหม่ข้างล่าง)", "err"); return; }
    if (!step) { J.msg($("form-msg"), "เลือกขั้นตอนก่อน", "err"); return; }
    if (!good && !bad) { J.msg($("form-msg"), "ใส่จำนวนที่ทำได้ หรือจำนวนรอบที่ต้องแก้", "err"); return; }
    var t1 = $("f-tstart").value || null, t2 = $("f-tend").value || null;
    if ((!t1 || !t2) && !skipTime) {
      skipTime = true;
      J.msg($("form-msg"), "ยังไม่ได้ใส่เวลาเริ่ม–เวลาเสร็จ ถ้าจำไม่ได้ กดส่งอีกครั้งเพื่อบันทึกโดยไม่มีเวลา", "warn");
      return;
    }
    $("submit").disabled = true;
    J.submit({
      p_name: m.name, p_pin: m.pin, p_project: prj, p_step: step,
      p_good: good, p_bad: bad,
      p_date: $("f-date").value || J.today(),
      p_note: $("f-note").value || null,
      p_time_start: t1, p_time_end: t2
    }, "app_rd_submit").then(function (r) {
      J.msg($("form-msg"), r && r.queued
        ? "เน็ตไม่ติด — เก็บไว้ในเครื่องแล้ว จะส่งให้เองเมื่อเน็ตกลับมา"
        : "บันทึกเรียบร้อย ขอบคุณครับ", r && r.queued ? "warn" : "ok");
      $("f-good").value = ""; $("f-bad").value = ""; $("f-note").value = "";
      $("f-tstart").value = ""; $("f-tend").value = "";
      skipTime = false;
      updateDuration();
      if (r && r.id) uploadShots(r.id);
      else if (shots.length) {
        J.msg($("form-msg"), "เน็ตไม่ติด — บันทึกงานเก็บไว้แล้ว แต่รูปแนบไม่ได้ตอนออฟไลน์ ค่อยแนบใหม่ทีหลัง", "warn");
        shots = []; renderShots();
      }
      loadProjects(); loadRecent();
    }).catch(function (err) { J.msg($("form-msg"), err.message, "err"); })
      .then(function () { $("submit").disabled = false; });
  });

  /* ---------- งานล่าสุด ---------- */
  function loadRecent() {
    var m = J.me.get();
    J.rpc("app_my_entries", { p_name: m.name, p_pin: m.pin, p_limit: 40 }).then(function (list) {
      var rows = (list || []).filter(function (r) { return !!r.project; }).slice(0, 15);
      if (!rows.length) {
        $("recent").innerHTML = '<p class="hint" style="padding:14px 0">ยังไม่มีงาน RD ที่ลงไว้</p>';
        return;
      }
      $("recent").innerHTML = rows.map(function (r) {
        return '<div class="row"><div class="main">' +
          '<div class="t">' + J.esc(r.step) + " · " + J.esc(r.project_name || r.project) + "</div>" +
          '<div class="s">' + J.esc(r.project) + " · " + J.esc(J.thDate(r.work_date)) +
          (r.time_start && r.time_end ? " · " + J.esc(r.time_start) + "–" + J.esc(r.time_end) : "") +
          (r.photos ? " · " + r.photos + " รูป" : "") +
          (r.note ? " · " + J.esc(r.note) : "") + "</div></div>" +
          '<div class="n">' + J.nf.format(r.qty_good) +
          (r.qty_bad ? "<i>แก้ " + J.nf.format(r.qty_bad) + "</i>" : "") +
          "<br>" + (CHIP[r.review_status] || "") +
          (r.can_delete ? ' <button class="btn btn-sm btn-danger" data-del="' + J.esc(r.id) +
                          '" type="button">ลบ</button>' : "") +
          "</div></div>";
      }).join("");
      Array.prototype.forEach.call($("recent").querySelectorAll("[data-del]"), function (b) {
        b.addEventListener("click", function () {
          if (!confirm("ลบรายการนี้?")) return;
          var mm = J.me.get();
          J.rpc("app_delete_entry", { p_name: mm.name, p_pin: mm.pin, p_id: b.dataset.del })
            .then(function () { loadRecent(); loadProjects(); })
            .catch(function (err) { alert(err.message); });
        });
      });
    }).catch(function () {});
  }

  /* ---------- คิวออฟไลน์ ---------- */
  function paintQueue(n) {
    var q = $("queue");
    if (!n) { q.hidden = true; return; }
    q.hidden = false;
    q.textContent = "มี " + n + " รายการรอส่งเมื่อเน็ตกลับมา";
  }
  J.onQueueChange(paintQueue);
  paintQueue(J.queueLength());

  /* ---------- เริ่ม ---------- */
  loadBoot().then(function () {
    var m = J.me.get();
    if (m.name && m.pin) enterApp(m.role);
  }).catch(function (err) { J.msg($("login-msg"), err.message, "err"); });
})();
</script>
</body>
</html>
